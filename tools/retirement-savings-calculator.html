function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n)); if(last) render(last)}
function calc(){const a=n('currentAge'), r=n('retirementAge'), s=n('currentSavings'), m=n('monthlyContribution'), ar=n('annualReturn')/100, inf=n('inflation')/100, inc=n('targetIncome'), cur=$('currency').value; const years=Math.round(r-a); if(a<0||r<=a||years>80||s<0||m<0||ar<=-0.99||ar>1||inf<-0.5||inf>1){throw new Error(t('invalidInput'))} let bal=s, contrib=s, rows=[]; const mr=Math.pow(1+ar,1/12)-1; for(let y=1;y<=years;y++){for(let i=0;i<12;i++){bal=bal*(1+mr)+m; contrib+=m} const today=bal/Math.pow(1+inf,y); rows.push({year:y,age:a+y,balance:bal,today,contrib});} const final=rows.length?rows[rows.length-1]:{balance:s,today:s,contrib:s}; const target=inc*12*25; const gap=Math.max(0,target-final.today); return {years,cur,rows,final,target,gap,growth:final.balance-final.contrib};}
function render(d){last=d; $('err').style.display='none'; const items=[['yearsLeft',d.years,''],['retirementBalance',d.final.balance,d.cur],['todayValue',d.final.today,d.cur],['totalContrib',d.final.contrib,d.cur],['growth',d.growth,d.cur],['gap',d.gap,d.cur]]; $('metrics').innerHTML=items.map(x=>`<div class="metric ${x[0]==='gap'?(d.gap>0?'bad':'good'):''}"><div class="k">${t(x[0])}</div><div class="v">${x[2]?money(x[1],x[2]):x[1]}</div></div>`).join(''); $('status').className='status '+(d.gap>0?'bad':'good'); $('status').textContent=(d.gap>0?t('behind')+': '+money(d.gap,d.cur):t('onTrack'))+' • '+t('targetNeeded')+': '+money(d.target,d.cur); $('tbody').innerHTML=d.rows.map(r=>`<tr><td>${r.year} (${r.age})</td><td>${money(r.balance,d.cur)}</td><td>${money(r.today,d.cur)}</td><td>${money(r.contrib,d.cur)}</td></tr>`).join(''); draw(d.rows);}
function draw(rows){const svg=$('chart'); if(!rows.length){svg.innerHTML='';return} const W=700,H=270,p=28,max=Math.max(...rows.map(r=>r.balance),1); const pts=rows.map((r,i)=>[p+(i/(rows.length-1||1))*(W-2*p),H-p-(r.balance/max)*(H-2*p)]); const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '); svg.innerHTML=`<rect width="700" height="270" fill="#fff"/><path d="M${p} ${H-p}H${W-p}M${p} ${p}V${H-p}" stroke="#d0d5dd" fill="none"/><path d="${path}" stroke="#2563eb" stroke-width="4" fill="none"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="5" fill="#7c3aed"/>`;}
function run(){try{render(calc())}catch(e){$('err').textContent=e.message;$('err').style.display='block'}}
$('form').addEventListener('submit',e=>{e.preventDefault();run()}); $('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('pratix_retirement_lang',lang);apply()}); $('print').addEventListener('click',()=>window.print()); $('csv').addEventListener('click',()=>{if(!last)run(); const lines=['year,age,balance,today_value,contributions'].concat(last.rows.map(r=>[r.year,r.age,Math.round(r.balance),Math.round(r.today),Math.round(r.contrib)].join(','))); const blob=new Blob([lines.join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='retirement-savings-projection.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000)}); $('lang').value=lang; apply(); run();
})();
</script>
</body></html>
